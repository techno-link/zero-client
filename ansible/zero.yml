---
# Zero Client Configuration Playbook
# This is the main orchestrator that applies all roles in order.

- name: "Configure Zero Client"
  hosts: localhost
  connection: local
  gather_facts: yes

  vars_files:
    - vars/main.yml

  roles:
    - base
    - network
    - desktop
    - workspaces
    - parsec

  # Post-role tasks that don't fit into a specific role
  post_tasks:
    # Geolocation-based Timezone (skip in CHROOT)
    - name: Get IP geolocation data
      community.general.ipinfoio_facts:
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Set timezone from geolocation
      ansible.builtin.timezone:
        name: "{{ ansible_facts.timezone }}"
      when:
        - ansible_facts.timezone is defined
        - lookup('env', 'ZEROSTATE') != 'CHROOT'
