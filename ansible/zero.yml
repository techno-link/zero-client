---
- name: "configure zero client kiosk"
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    branch_version: "4-web-kiosk"
    kiosk_url: "https://mes-app-dev.technolink.org/#/alu/powder-coating"

  handlers:
    - name: Apply netplan configuration
      ansible.builtin.command:
        cmd: netplan apply
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Restart chromium-kiosk
      ansible.builtin.systemd:
        name: chromium-kiosk.service
        state: restarted
        daemon_reload: yes
      when: lookup('env', 'ZEROSTATE') not in ['CHROOT', 'FIRSTBOOT']

  tasks:
    # ------------------------------------------------------------------------------------------------------------------
    # APT
    # ------------------------------------------------------------------------------------------------------------------
    - name: Add the Universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        state: present
        update_cache: yes

    - name: Ensure snapd is installed
      ansible.builtin.apt:
        name: snapd
        state: latest
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Wait for snapd seeding to complete
      ansible.builtin.command: snap wait system seed.loaded
      changed_when: false
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Refresh snapd through snap
      ansible.builtin.snap:
        name:
          - snapd
          - core
        state: present
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        name: "*"
        state: latest

    - name: Install base tools and cage compositor
      ansible.builtin.apt:
        name:
          - wget
          - cage
          - iptables
          - dnsutils
          - iputils-ping
          - traceroute
          - net-tools
          - tcpdump
        state: latest

    - name: Remove useless packages from the cache and purge
      ansible.builtin.apt:
        autoclean: yes

    - name: Remove dependencies that are no longer required
      ansible.builtin.apt:
        autoremove: yes
        purge: yes

    # ------------------------------------------------------------------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------------------------------------------------------------------
    - name: Create Netplan configuration for DHCP
      ansible.builtin.copy:
        dest: "/etc/netplan/01-dhcp.yaml"
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              primary:
                match:
                  name: en*
                dhcp4: true
                dhcp-identifier: mac
        owner: root
        group: root
        mode: "0644"
        force: yes
      notify: Apply netplan configuration

    - name: Mark HTTPS TCP traffic with AF11 DSCP class
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DSCP
        table: mangle
        set_dscp_mark_class: AF11
        protocol: tcp
        destination_port: "443"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Update hostname
      ansible.builtin.hostname:
        name: "LINKIN-ZERO-{{ branch_version }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # ------------------------------------------------------------------------------------------------------------------
    # CHROMIUM + KIOSK SERVICE
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install Chromium (snap)
      community.general.snap:
        name: chromium
        state: present
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Hold Chromium snap auto-refresh
      ansible.builtin.command: snap refresh --hold chromium
      changed_when: false
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Ensure zero log directory exists
      ansible.builtin.file:
        path: /home/zero/.config/linkin
        state: directory
        owner: zero
        group: zero
        mode: "0755"

    - name: Write chromium-kiosk environment file
      ansible.builtin.copy:
        dest: /etc/default/chromium-kiosk
        owner: root
        group: root
        mode: "0644"
        content: |
          KIOSK_URL={{ kiosk_url }}
      notify: Restart chromium-kiosk

    - name: Enable chromium-kiosk service
      ansible.builtin.systemd:
        name: chromium-kiosk.service
        enabled: yes
        daemon_reload: yes
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # ------------------------------------------------------------------------------------------------------------------
    # LOCALE / TIMEZONE
    # ------------------------------------------------------------------------------------------------------------------
    - name: Generate locales
      ansible.builtin.locale_gen:
        name: "{{ item }}"
        state: present
      loop:
        - en_US.UTF-8
        - bg_BG.UTF-8

    - name: Set timezone to Europe/Sofia
      ansible.builtin.shell: |
        ln -sf /usr/share/zoneinfo/Europe/Sofia /etc/localtime
        echo "Europe/Sofia" > /etc/timezone
      changed_when: false
