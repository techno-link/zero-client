---
- name: "configure zero client"
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    branch_version: "4-web-kiosk"
    kiosk_url: "https://mes-app-dev.technolink.org/#/alu/powder-coating"
    hide_apps:
      - /usr/share/applications/org.gnome.gedit.desktop
      - /usr/share/applications/gnome-control-center.desktop
      - /usr/share/applications/yelp.desktop
      - /usr/share/applications/org.gnome.Terminal.desktop
      - /usr/share/applications/gnome-language-selector.desktop
      - /usr/share/applications/gnome-session-properties.desktop
      - /usr/share/applications/com.gexperts.Tilix.desktop
      - /usr/share/applications/nm-connection-editor.desktop
      - /var/lib/snapd/desktop/applications/firefox_firefox.desktop
      - /var/lib/snapd/desktop/applications/chromium_chromium.desktop

  handlers:
    - name: Reload systemd and restart getty@tty1
      ansible.builtin.systemd:
        daemon_reload: yes
        name: getty@tty1
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Apply netplan configuration
      ansible.builtin.command:
        cmd: netplan apply
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Reboot
      command: reboot
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

  tasks:
    # ------------------------------------------------------------------------------------------------------------------
    # UPDATE AND CLEANUP APT
    # ------------------------------------------------------------------------------------------------------------------
    - name: Add the Universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        state: present
        update_cache: yes

    - name: Ensure snapd is installed
      ansible.builtin.apt:
        name: snapd
        state: latest
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Refresh snapd through snap
      ansible.builtin.snap:
        name:
          - snapd
          - core
        state: present
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        name: "*"
        state: latest

    - name: Install/upgrade wget
      ansible.builtin.apt:
        name: wget
        state: latest

    - name: Remove useless packages from the cache and purge
      ansible.builtin.apt:
        autoclean: yes

    - name: Remove dependencies that are no longer required
      ansible.builtin.apt:
        autoremove: yes
        purge: yes

    - name: Install python pip
      ansible.builtin.apt:
        name: python3-pip
        state: latest

    # ------------------------------------------------------------------------------------------------------------------
    # CONFIGURE TTY
    # ------------------------------------------------------------------------------------------------------------------
    - name: Disable other TTYs (tty2-tty6)
      ansible.builtin.systemd:
        name: getty@tty{{ item }}
        enabled: no
        masked: yes
        state: stopped
      loop: [2, 3, 4, 5, 6]
      notify: Reload systemd

    # ------------------------------------------------------------------------------------------------------------------
    # NETWORK CONFIG
    # ------------------------------------------------------------------------------------------------------------------
    - name: Create Netplan configuration for DHCP
      ansible.builtin.copy:
        dest: "/etc/netplan/01-dhcp.yaml"
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              primary:
                match:
                  name: en*
                dhcp4: true
                dhcp-identifier: mac
        owner: root
        group: root
        mode: "0644"
        force: yes
      notify: Apply netplan configuration

    - name: Install basic network debugging tools
      ansible.builtin.apt:
        name:
          - iptables
          - dnsutils
          - iputils-ping
          - traceroute
          - net-tools
          - tcpdump
        state: latest

    # HTTPS TCP Marking
    - name: Mark HTTPS TCP traffic
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DSCP
        table: mangle
        set_dscp_mark_class: AF11
        protocol: tcp
        destination_port: "443"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Update hostname
      ansible.builtin.hostname:
        name: "LINKIN-ZERO-{{ branch_version }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # ------------------------------------------------------------------------------------------------------------------
    # OPENBOX AND GUI INSTALLATION
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install Gnome
      ansible.builtin.apt:
        name:
          - gdm3
        state: latest

    - name: Install GUI Applications
      ansible.builtin.apt:
        name:
          - firefox # Cannot install snaps in chroot
          - gnome-terminal # Cannot install snaps in chroot
          - gnome-system-monitor # Cannot install snaps in chroot
        state: latest
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Install Chromium (snap)
      community.general.snap:
        name: chromium
        state: present
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Configure GDM for auto-login
      ansible.builtin.copy:
        dest: "/etc/gdm3/custom.conf"
        content: |
          [daemon]
          AutomaticLoginEnable=True
          AutomaticLogin=zero
        owner: root
        group: root
        mode: "0644"

    - name: Set preferred session for auto-login user
      ansible.builtin.copy:
        dest: "/home/zero/.dmrc"
        content: |
          [Desktop]
          Session=ubuntu-wayland
        owner: zero
        group: zero
        mode: "0644"

    - name: Ensure GDM is enabled and running
      ansible.builtin.systemd:
        name: gdm
        enabled: yes
        state: started

    # ------------------------------------------------------------------------------------------------------------------
    # WORKSPACE CONFIG
    # ------------------------------------------------------------------------------------------------------------------
    - name: Allow unprivileged users to create user namespaces
      ansible.builtin.sysctl:
        name: kernel.unprivileged_userns_clone
        value: "1"
        state: present
        reload: yes
        sysctl_set: yes
        sysctl_file: /etc/sysctl.d/99-unprivileged-userns-clone.conf

    - name: Create required directories for zero user
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: zero
        group: zero
      loop: ["/home/zero/.config/linkin", "/home/zero/.config/autostart", "/home/zero/.local/share/applications"]

    - name: Get workspace configs
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/techno-link/zero-client/v{{ branch_version }}/desktop/{{ item.file }}"
        dest: "{{ item.dest }}"
        force: yes
        owner: zero
        group: zero
        mode: "{{ item.mode | default(omit) }}"
      loop:
        - { file: "wallpaper.jpg", dest: "/home/zero/.config/linkin/wallpaper.jpg" }
        - { file: "gsettings.sh", dest: "/home/zero/.config/linkin/gsettings.sh", mode: "0755" }
      notify: Reboot

    - name: Ensure the script runs at session start
      copy:
        content: |
          [Desktop Entry]
          Type=Application
          Name=UserSettings
          Exec=/home/zero/.config/linkin/gsettings.sh
          X-GNOME-Autostart-enabled=true
        dest: "/home/zero/.config/autostart/user-settings.desktop"
        owner: zero
        group: zero
        mode: "0644"

    # ------------------------------------------------------------------------------------------------------------------
    # CHROMIUM KIOSK
    # ------------------------------------------------------------------------------------------------------------------
    - name: Ensure Chromium managed-policy directory exists
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write Chromium managed policies for kiosk
      ansible.builtin.copy:
        dest: /etc/chromium/policies/managed/kiosk.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "HomepageLocation": "{{ kiosk_url }}",
            "HomepageIsNewTabPage": false,
            "RestoreOnStartup": 4,
            "RestoreOnStartupURLs": ["{{ kiosk_url }}"],
            "DeveloperToolsAvailability": 2,
            "IncognitoModeAvailability": 1,
            "PasswordManagerEnabled": false,
            "AutofillAddressEnabled": false,
            "AutofillCreditCardEnabled": false,
            "SearchSuggestEnabled": false,
            "MetricsReportingEnabled": false,
            "DefaultBrowserSettingEnabled": false,
            "DownloadRestrictions": 3,
            "URLBlocklist": ["chrome://settings", "chrome://flags", "chrome://extensions"]
          }

    - name: Autostart Chromium in kiosk mode
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Type=Application
          Name=Kiosk Browser
          Exec=chromium --kiosk --noerrdialogs --disable-infobars --disable-session-crashed-bubble --no-first-run --disable-translate --password-store=basic {{ kiosk_url }}
          X-GNOME-Autostart-enabled=true
        dest: "/home/zero/.config/autostart/kiosk-browser.desktop"
        owner: zero
        group: zero
        mode: "0644"

    # HIDE APPS
    - name: Copy .desktop files to ~/.local/share/applications
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/zero/.local/share/applications/"
        force: yes
        owner: zero
        group: zero
        mode: "0644"
      loop: "{{ hide_apps }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    - name: Ensure NoDisplay=true is set in .desktop files
      ansible.builtin.lineinfile:
        path: "/home/zero/.local/share/applications/{{ item | basename }}"
        insertafter: '^\[Desktop Entry\]'
        line: "NoDisplay=true"
        create: no
      loop: "{{ hide_apps }}"
      when: lookup('env', 'ZEROSTATE') != 'CHROOT'

    # ALLOW UNLOCK SCREEN
    - name: Add nopasswdlogin rule to gdm-password
      ansible.builtin.lineinfile:
        path: /etc/pam.d/gdm-password
        line: "auth sufficient pam_succeed_if.so user ingroup nopasswdlogin"
        insertbefore: BOF

    - name: Create nopasswdlogin group
      ansible.builtin.group:
        name: nopasswdlogin
        state: present

    - name: Add user to nopasswdlogin group
      ansible.builtin.user:
        name: "zero"
        groups: nopasswdlogin
        append: yes

    # ------------------------------------------------------------------------------------------------------------------
    # INSTALL PYTHON PSUTIL LIBRARY REQUIRED FOR COMMUNITY.GENERAL.DCONF
    # ------------------------------------------------------------------------------------------------------------------
    - name: Install psutil python package
      ansible.builtin.apt:
        name: python3-psutil
        state: latest

    # ------------------------------------------------------------------------------------------------------------------
    # LOCALE CONFIGURATION
    # ------------------------------------------------------------------------------------------------------------------
    - name: Generate locales (bg_BG and en_US)
      ansible.builtin.locale_gen:
        name: "{{ item }}"
        state: present
      loop:
        - en_US.UTF-8
        - bg_BG.UTF-8

    # ------------------------------------------------------------------------------------------------------------------
    # SET TIMEZONE
    # ------------------------------------------------------------------------------------------------------------------
    - name: Set timezone to Europe/Sofia
      ansible.builtin.shell: |
        ln -sf /usr/share/zoneinfo/Europe/Sofia /etc/localtime
        echo "Europe/Sofia" > /etc/timezone
      changed_when: false
